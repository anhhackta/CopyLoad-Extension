<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CopyLoad - Quản lý Clipboard</title>
  <link rel="stylesheet" href="fullpage.css">
</head>

<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">CL</div>
          <div class="logo-text">
            <span class="logo-name">CopyLoad</span>
            <span class="logo-version">v2.1</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span data-i18n="textClipboard">Text Clipboard</span>
          <span class="nav-count" id="navTextCount">0</span>
        </button>
        <button class="nav-item" data-tab="images">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span data-i18n="imageClipboard">Image Clipboard</span>
          <span class="nav-count" id="navImageCount">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="storage-info">
          <div class="storage-label">
            <span data-i18n="storage">Dung lượng</span>
            <span id="storagePercent">0%</span>
          </div>
          <div class="storage-bar-full">
            <div class="storage-fill-full" id="storageFillFull"></div>
          </div>
          <span class="storage-size" id="storageSizeFull">0 KB / 10 MB</span>
        </div>

        <button class="settings-btn" id="toggleThemeFull">
          <svg id="themeIconFull" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span data-i18n="toggleTheme">Đổi theme</span>
        </button>

        <button class="settings-btn" id="toggleLangFull">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="langLabel">Tiếng Việt</span>
        </button>

        <div class="author-credit">
          <a href="https://github.com/anhhackta/" target="_blank">Made by @anhhackta</a>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="content-header">
        <div class="header-left">
          <h1 id="pageTitle" data-i18n="textClipboard">Text Clipboard</h1>
          <span class="item-count" id="itemCount">0 items</span>
        </div>
        <div class="header-actions">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="M21 21l-4.35-4.35"></path>
            </svg>
            <input type="text" id="searchInputFull" placeholder="Tìm kiếm..." data-i18n-placeholder="search">
          </div>
          <button class="action-btn" id="importBtnFull">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span data-i18n="import">Import</span>
          </button>
          <button class="action-btn primary" id="exportBtnFull">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span data-i18n="export">Export</span>
          </button>
          <button class="action-btn danger" id="clearAllBtnFull">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
            </svg>
            <span data-i18n="clearAll">Xóa tất cả</span>
          </button>
        </div>
      </header>

      <!-- Text Content -->
      <div class="content-area active" id="textContent">
        <div class="text-grid" id="textGridFull"></div>
      </div>

      <!-- Image Content -->
      <div class="content-area" id="imageContent">
        <div class="image-grid-full" id="imageGridFull"></div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modalFull" class="modal-overlay">
    <div class="modal-box">
      <h3 id="modalTitle" data-i18n="confirmDelete">Xác nhận xóa?</h3>
      <p id="modalText" data-i18n="deleteWarning">Dữ liệu sẽ bị xóa vĩnh viễn.</p>
      <div class="modal-actions">
        <button class="modal-btn" id="modalCancel" data-i18n="cancel">Hủy</button>
        <button class="modal-btn danger" id="modalConfirm" data-i18n="delete">Xóa</button>
      </div>
    </div>
  </div>

  <!-- Image Preview -->
  <div id="imagePreviewFull" class="image-preview-overlay">
    <img id="previewImgFull" src="" alt="">
    <div class="preview-info">
      <span class="preview-size" id="previewSize"></span>
      <span class="preview-time" id="previewTime"></span>
    </div>
    <div class="preview-actions">
      <button class="preview-btn" id="previewCopy" data-i18n="copy">Copy</button>
      <button class="preview-btn" id="previewDownload" data-i18n="download">Tải xuống</button>
      <button class="preview-btn danger" id="previewDelete" data-i18n="delete">Xóa</button>
      <button class="preview-btn" id="previewClose" data-i18n="close">Đóng</button>
    </div>
  </div>

  <!-- Text Detail Modal -->
  <div id="textDetailModal" class="modal-overlay">
    <div class="modal-box wide">
      <div class="text-detail-header">
        <h3 data-i18n="textDetail">Chi tiết</h3>
        <span class="text-time" id="textDetailTime"></span>
      </div>
      <div class="text-detail-content" id="textDetailContent"></div>
      <div class="modal-actions">
        <button class="modal-btn" id="textDetailCopy" data-i18n="copy">Copy</button>
        <button class="modal-btn danger" id="textDetailDelete" data-i18n="delete">Xóa</button>
        <button class="modal-btn" id="textDetailClose" data-i18n="close">Đóng</button>
      </div>
    </div>
  </div>

  <input type="file" id="importFileFull" style="display:none" accept=".txt,.json">

  <script src="fullpage.js"></script>
</body>

</html>
